name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Проверка кода
        env:
          CGO_ENABLED: "0"
        run: go vet -tags gui .

      - name: Свойства файла и манифест (наш генератор, версия из файла VERSION)
        env:
          CGO_ENABLED: "0"
        run: go run ./tools/mkres

      # Параметры сборки заданы явно, чтобы результат не зависел от машины:
      # без cgo (компилятор C на сборочной машине не участвует) и без вшитых сведений о Git.
      - name: Сборка (окно)
        env:
          CGO_ENABLED: "0"
        run: go build -tags gui -trimpath -buildvcs=false -ldflags "-s -w -H windowsgui" -o MCLiga.exe .

      - name: Параметры сборки (для проверки)
        run: go version -m MCLiga.exe

      - name: Контрольная сумма
        shell: pwsh
        run: |
          $h = (Get-FileHash MCLiga.exe -Algorithm SHA256).Hash.ToLower()
          "$h  MCLiga.exe" | Out-File -Encoding ascii MCLiga.exe.sha256
          Get-Content MCLiga.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MCLiga-windows
          path: |
            MCLiga.exe
            MCLiga.exe.sha256

  release:
    # Публикуется только при отправке тега вида v0.1.0. Файл тот же, что собрала задача windows.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MCLiga-windows

      - name: Тег должен совпадать с файлом VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"

      - name: Создать релиз (пробная версия, без подписи)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MCLiga.exe MCLiga.exe.sha256 \
            --prerelease --verify-tag --title "MCLiga Launcher ${GITHUB_REF_NAME#v} (пробная версия)" \
            --notes "Пробная версия, файл пока не подписан: Windows может показать предупреждение SmartScreen. Сборка воспроизводимая: контрольную сумму SHA-256 из MCLiga.exe.sha256 можно сравнить с шагом «Контрольная сумма» в журнале сборки."
